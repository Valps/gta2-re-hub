site_name: GTA2 RE Hub
site_description: GTA2 Reverse Engineering Hub.
site_url: https://valps.github.io/gta2-re-hub/
repo_url: https://github.com/Valps/gta2-re-hub
repo_name: Valps/gta2-re-hub

theme:
  name: material
  logo: images/Car_BC.png
  favicon: images/Car_BC.png
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tabs
    - navigation.path
    - navigation.indexes
nav:
  - Home: index.md
  - 'Getting Started': getting_started.md
  - 'How to contribute' : how_contribute.md
  - Decomp info :
    - Index : decomp_info/index.md
    - 'Repo Folders' : decomp_info/repo_folders.md
    - 'Var types' : decomp_info/types.md
    - 'Markers' : decomp_info/markers.md
    - 'Globals' : decomp_info/globals.md
    - 'Patching' : decomp_info/patching.md
    - 'IDA scripts' : decomp_info/ida_scripts.md
    - 'Function Diff' : decomp_info/diff.md
    - 'Renaming' : decomp_info/renaming.md
    - 'Matching Functions' : decomp_info/matching_funcs.md
  - Game info :
    - Index : gameinfo/index.md
    - 'Scripting' : 
      - gameinfo/scripting/index.md
      - 'How commands work' : gameinfo/scripting/how_commands_work.md
      - 'How to implement new commands' : gameinfo/scripting/new_commands.md
    - 'Frontend' : 
      - gameinfo/frontend/index.md
      - 'Adding new frontend pages' : gameinfo/frontend/new_pages.md
